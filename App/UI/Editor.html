<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if is_new %}Create New Note{% else %}Edit Note{% endif %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fefae0 0%, #faedcd 100%);
            min-height: 100vh;
        }
        
        .editor-container {
            max-width: 900px;
            margin: 2rem auto;
        }
        
        .editor-card {
            background: #fefae0;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .editor-header {
            background: linear-gradient(135deg, #ccd5ae 0%, #d4a373 100%);
            color: #2c3e2f;
            padding: 1.5rem;
        }
        
        .note-title-input {
            border: none;
            font-size: 2rem;
            font-weight: 600;
            padding: 1.5rem;
            width: 100%;
            outline: none;
            color: #2c3e2f;
            background: #fefae0;
        }
        
        .note-title-input::placeholder {
            color: #d4a373;
        }
        
        .note-content-input {
            border: none;
            padding: 0 1.5rem 1.5rem 1.5rem;
            width: 100%;
            min-height: 400px;
            outline: none;
            resize: vertical;
            font-size: 1rem;
            line-height: 1.6;
            color: #2c3e2f;
            background: #fefae0;
        }
        
        .note-content-input::placeholder {
            color: #d4a373;
        }
        
        .color-palette {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid #e9edc9;
            border-bottom: 1px solid #e9edc9;
            background: #fefae0;
        }
        
        .color-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .color-dot:hover {
            transform: scale(1.1);
        }
        
        .color-dot.selected {
            border-color: #2c3e2f;
            transform: scale(1.1);
        }
        
        .color-dot.default { background: #fefae0; border: 2px solid #d4a373; }
        .color-dot.warm { background: #faedcd; }
        .color-dot.sage { background: #ccd5ae; }
        .color-dot.cream { background: #e9edc9; }
        .color-dot.clay { background: #d4a373; }
        .color-dot.earth { background: #faedcd; }
        
        .action-buttons {
            padding: 1.5rem;
            background: #e9edc9;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #ccd5ae 0%, #d4a373 100%);
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 600;
            color: #2c3e2f;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 163, 115, 0.4);
            color: #2c3e2f;
            background: linear-gradient(135deg, #d4a373 0%, #ccd5ae 100%);
        }
        
        .btn-outline-secondary {
            border-color: #d4a373;
            color: #d4a373;
        }
        
        .btn-outline-secondary:hover {
            background-color: #d4a373;
            border-color: #d4a373;
            color: #fefae0;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #e9edc9;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #d4a373;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #ccd5ae;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Header with navigation -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="/" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Notes
            </a>
        </div>
        
        <!-- Main Editor Card -->
        <div class="editor-card">
            <div class="editor-header">
                <h5 class="mb-0">
                    <i class="bi bi-pencil-square me-2"></i>
                    {% if is_new %}Create New Note{% else %}Edit Note{% endif %}
                </h5>
            </div>
            
            <!-- Form -->
            <form method="post" action="{% if is_new %}/notes/create{% else %}/notes/update/{{ note.id }}{% endif %}">
                <!-- Title Input -->
                <input type="text" class="note-title-input" name="title" 
                       placeholder="Note title..." 
                       value="{% if note %}{{ note.title }}{% endif %}" required>
                
                <!-- Content Input -->
                <textarea class="note-content-input" name="content" 
                          placeholder="Write your note here..." required>{% if note %}{{ note.content }}{% endif %}</textarea>
                <!-- Color Palette -->
                <div class="color-palette">
                    <input type="hidden" name="color" id="selectedColor" 
                           value="{% if note %}{{ note.color }}{% else %}#ccd5ae{% endif %}">
                    <span class="color-dot sage {% if note and note.color == '#ccd5ae' %}selected{% endif %}" 
                          onclick="selectColor('#ccd5ae', this)" title="Sage Green"></span>
                    <span class="color-dot cream {% if note and note.color == '#e9edc9' %}selected{% endif %}" 
                          onclick="selectColor('#e9edc9', this)" title="Cream"></span>
                    <span class="color-dot default {% if note and note.color == '#fefae0' %}selected{% endif %}" 
                          onclick="selectColor('#fefae0', this)" title="Light Cream"></span>
                    <span class="color-dot earth {% if note and note.color == '#faedcd' %}selected{% endif %}" 
                          onclick="selectColor('#faedcd', this)" title="Warm Beige"></span>
                    <span class="color-dot clay {% if note and note.color == '#d4a373' %}selected{% endif %}" 
                          onclick="selectColor('#d4a373', this)" title="Terracotta"></span>
                </div>
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <div class="row">
                        <div class="col-md-12 text-end">
                            <a href="/" class="btn btn-outline-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-save">
                                <i class="bi bi-check2"></i> 
                                {% if is_new %}Create Note{% else %}Update Note{% endif %}
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selectColor(color, element) {
            document.getElementById('selectedColor').value = color;
            
            // Update selected class on dots
            document.querySelectorAll('.color-dot').forEach(dot => {
                dot.classList.remove('selected');
            });
            // Add selected class to clicked element
            element.classList.add('selected');
        }
    </script>
</body>
</html>
