{% extends "Layout.html" %}

{% block title %}{% if note %}Edit{% else %}Create{% endif %} Note{% endblock %}

{% block content %}
<div class="editor-container">
    <!-- Header with navigation -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Notes
        </a>
    </div>
    
    <!-- Main Editor Card -->
    <div class="editor-card">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0">
                <i class="bi bi-pencil-square me-2"></i>
                {% if note %}Edit{% else %}Create New{% endif %} Note
            </h5>
        </div>
        
        <form id="noteForm" method="POST" action="{% if note %}/notes/{{ note.id }}{% else %}/notes{% endif %}">
            <!-- Title Input -->
            <input type="text" 
                   class="note-title-input" 
                   name="title"
                   placeholder="Note title..." 
                   value="{{ note.title if note else '' }}"
                   required>
            
            <!-- Content Input -->
            <textarea class="note-content-input" 
                      name="content"
                      placeholder="Write your note here..." 
                      required>{{ note.content if note else '' }}</textarea>
            
            <!-- Color Selection -->
            <div class="px-4 py-3 border-top">
                <label class="form-label">Note Color</label>
                <div class="d-flex gap-2">
                    <select name="color" class="form-select" style="width: auto;">
                        <option value="#667eea" {% if note and note.color == '#667eea' %}selected{% endif %}>Purple</option>
                        <option value="#f093fb" {% if note and note.color == '#f093fb' %}selected{% endif %}>Pink</option>
                        <option value="#4facfe" {% if note and note.color == '#4facfe' %}selected{% endif %}>Blue</option>
                        <option value="#43e97b" {% if note and note.color == '#43e97b' %}selected{% endif %}>Green</option>
                        <option value="#fa709a" {% if note and note.color == '#fa709a' %}selected{% endif %}>Orange</option>
                        <option value="#ffffff" {% if note and note.color == '#ffffff' %}selected{% endif %}>White</option>
                    </select>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="px-4 py-3 bg-light border-top">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2"></i> Save Note
                </button>
                {% if note %}
                <button type="button" onclick="deleteNote" class="btn btn-outline-danger ms-2">
                    <i class="bi bi-trash"></i> Delete
                </button>
                {% endif %}
            </div>
        </form>
    </div>
</div>

<script>
function deleteNote(noteId) {
    if (confirm('Are you sure you want to delete this note?')) {
        fetch(`/notes/${noteId}`, {
            method: 'DELETE',
        }).then(response => {
            if (response.ok) {
                window.location.href = '/';
            }
        });
    }
}
</script>
{% endblock %}
